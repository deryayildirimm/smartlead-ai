services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_local_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_local_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local_env.py first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - passageport_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  passageport_postgres:
